<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0B0E14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AnarkShop">
  <meta name="description" content="Tus listas de compras, siempre a mano. Rápida, simple y disponible sin conexión.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>AnarkShop — tus compras, en orden</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Abrir menú" aria-expanded="false"> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/><path d="m7 6 2 2 3-3"/></svg></button>
      <div id="brandName" class="brand-name">AnarkShop</div><span class="header-spacer"></span>
    </header>
    <section id="homeView" class="view active">
      <div class="hero"><div id="homeEyebrow" class="eyebrow">Compras más simples</div><h1 id="homeGreeting">Hola</h1><p id="homeIntro">Organiza tus compras y lleva el control mientras recorres la tienda.</p></div>
      <div class="section-head"><h2 id="listsHeading">Tus listas</h2><span id="listCount" class="count"></span></div>
      <div id="listStack" class="list-stack"></div>
      <button class="primary create-cta" id="createListBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="createListLabel">Crear nueva lista</span></button>
    </section>
    <section id="detailView" class="view">
      <div class="detail-head"><button class="back-btn" id="backBtn" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><div class="detail-title-wrap"><div id="detailTitle" class="detail-title"></div><div id="detailSub" class="detail-sub"></div></div><button class="icon-btn" id="shareBtn" aria-label="Compartir" title="Compartir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.7 6.6-4.4m-6.6 7 6.6 4.4"/></svg></button><button id="deleteCurrentBtn" class="icon-btn danger-btn" aria-label="Eliminar lista" title="Eliminar lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg></button><button class="primary mode-action" id="modeBtn">Guardar lista</button></div>
      <div id="items" class="items"></div>
      <button class="primary detail-fab" id="addItemBtn" aria-label="Agregar artículo" title="Agregar artículo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <div class="summary"><div class="summary-inner"><div class="spent"><div id="spentLabel" class="spent-label">Gastado hasta ahora</div><div id="totalSpent" class="spent-total"></div></div><div class="progress-wrap"><div id="progressText" class="progress-text"></div><div class="progress-track"><div id="progressFill" class="progress-fill"></div></div></div><button id="clearBoughtBtn" class="primary" title="Quitar artículos comprados">Limpiar</button></div></div>
    </section>
  </main>
  <div id="drawerRoot">
    <div id="drawerScrim" class="drawer-scrim"></div>
    <aside class="drawer" aria-label="Menú principal">
      <div class="drawer-profile"><div id="drawerAvatar" class="avatar-badge">☀️</div><div><div id="drawerName" class="drawer-name">Usuario</div><div id="drawerCaption" class="drawer-caption">Listas de compras</div></div></div>
      <button id="homeNav" class="drawer-link" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1Z"/></svg>Inicio</button>
      <section id="savedListsSection" class="drawer-section" hidden>
        <h2 id="savedListsHeading" class="drawer-section-heading">Listas guardadas</h2>
        <div id="savedLists" class="saved-list-nav"></div>
      </section>
      <button id="profileNav" class="drawer-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Perfil</button>
      <div class="drawer-footer">AnarkShop</div>
    </aside>
  </div>
  <div id="modalBackdrop" class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><button class="close-btn" id="closeModal" aria-label="Cerrar">×</button></div><form id="modalForm"></form></section></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="updateBanner" class="update-banner" role="status" aria-live="polite" hidden>
    <span id="updateMessage"></span>
    <button id="updateButton" class="primary" type="button"></button>
  </div>
<script src="./app.js"></script>
</body>
</html>
