  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#101416;--surface:#191f21;--surface2:#222a2c;--text:#f4f7f6;--muted:#9aa8a6;--line:#303a3b;--accent:#00b6ae;--accent2:#85eee7;--danger:#ff6d74;--shadow:0 16px 44px #0005;--radius:22px}
    [data-theme="pastel"]{color-scheme:light;--bg:#fbf6f3;--surface:#fffdfb;--surface2:#f7e9e6;--text:#302a30;--muted:#81747e;--line:#d8c1cb;--accent:#d77b9b;--accent2:#b55d7c;--danger:#c95365;--shadow:0 20px 52px #6733483d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100dvh;transition:background .25s,color .25s}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}.app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 18px calc(30px + env(safe-area-inset-bottom))}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:-.04em;font-size:21px}.brand-mark{width:38px;height:38px;border-radius:13px;background:var(--accent);display:grid;place-items:center;color:#071415}.brand-mark svg{width:23px}.top-actions{display:flex;gap:9px}.icon-btn,.back-btn{border:1px solid var(--line);background:var(--surface);width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:var(--text)}.icon-btn svg,.back-btn svg{width:20px;height:20px}.hero{padding:27px 2px 23px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:800}.hero h1{font-size:clamp(31px,8vw,46px);line-height:1.05;letter-spacing:-.055em;margin:10px 0 8px}.hero p{color:var(--muted);margin:0;line-height:1.5}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 13px}.section-head h2{font-size:16px;margin:0;letter-spacing:-.02em}.count{font-size:12px;color:var(--muted)}.list-stack{display:grid;gap:11px}.list-card{border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:17px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 16px #00000008}.list-open{border:0;background:none;text-align:left;min-width:0;flex:1;padding:0}.list-title{display:block;font-weight:750;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list-meta{display:block;color:var(--muted);font-size:12px;margin-top:5px}.list-symbol{width:44px;height:44px;border-radius:15px;background:var(--surface2);display:grid;place-items:center;color:var(--accent);flex:none}.list-symbol svg{width:21px}.card-actions{display:flex;gap:6px}.small-btn{border:0;background:none;color:var(--muted);width:36px;height:36px;border-radius:12px;display:grid;place-items:center}.small-btn:hover{background:var(--surface2);color:var(--text)}.small-btn svg{width:18px}.primary{border:0;background:var(--accent);color:#061819;font-weight:800;border-radius:16px;padding:15px 18px;display:flex;justify-content:center;align-items:center;gap:9px;box-shadow:0 9px 20px color-mix(in srgb,var(--accent) 25%,transparent);transition:transform .15s,filter .15s}.primary:active{transform:scale(.98)}[data-theme="pastel"] .primary{color:white}.primary svg{width:19px}.create-cta{width:100%;margin-top:15px}.empty{border:1px dashed var(--line);border-radius:20px;padding:35px 20px;text-align:center;color:var(--muted)}.empty-icon{margin:0 auto 12px;width:50px;height:50px;border-radius:17px;background:var(--surface2);display:grid;place-items:center;color:var(--accent)}.empty-icon svg{width:24px}.empty strong{display:block;color:var(--text);margin-bottom:6px}.view{display:none}.view.active{display:block}.detail-head{display:flex;align-items:center;gap:12px;padding:10px 0 20px}.detail-title-wrap{flex:1;min-width:0}.detail-title{font-size:22px;font-weight:800;letter-spacing:-.04em;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.detail-sub{font-size:12px;color:var(--muted);margin-top:4px}.items{display:grid;gap:9px;padding-bottom:125px}.item{display:grid;grid-template-columns:27px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:13px 12px;transition:opacity .2s,background .2s}.item.done{background:color-mix(in srgb,var(--accent) 8%,var(--surface));}.check{appearance:none;width:23px;height:23px;border:2px solid var(--muted);border-radius:8px;display:grid;place-items:center;margin:0;cursor:pointer}.check:checked{background:var(--accent);border-color:var(--accent)}.check:checked:after{content:"";width:10px;height:6px;border:2px solid #061819;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}.item-main{min-width:0}.item-name{font-size:15px;font-weight:720;line-height:1.25;overflow-wrap:anywhere}.done .item-name{text-decoration:line-through;color:var(--muted)}.item-meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}.item-price{font-size:13px;font-weight:750;color:var(--accent2);white-space:nowrap;text-align:right}.item-price.empty-price{color:var(--muted);font-weight:500}.item-edit{grid-column:2/4;display:flex;justify-content:flex-end;margin-top:-3px}.item-edit button{border:0;background:none;color:var(--muted);font-size:11px;padding:4px}.summary{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,720px);padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.summary-inner{display:flex;align-items:center;gap:10px}.spent{flex:1}.spent-label{font-size:11px;color:var(--muted)}.spent-total{font-weight:850;font-size:22px;letter-spacing:-.04em;margin-top:1px}.progress-wrap{width:115px}.progress-text{text-align:right;font-size:11px;color:var(--muted);margin-bottom:7px}.progress-track{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden}.progress-fill{height:100%;background:var(--accent);border-radius:9px;transition:width .2s}.summary .primary{padding:12px 14px;border-radius:14px}.detail-fab{position:fixed;z-index:4;bottom:91px;right:max(22px,calc((100vw - 680px)/2));width:58px;height:58px;border-radius:20px;padding:0;box-shadow:var(--shadow)}.detail-fab svg{width:25px}.modal-backdrop{position:fixed;z-index:10;inset:0;background:#050809a8;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal-backdrop.open{display:flex}.modal{background:var(--surface);border:1px solid var(--line);border-radius:26px 26px 20px 20px;width:min(100%,540px);max-height:min(90dvh,820px);overflow:auto;padding:22px;box-shadow:var(--shadow);animation:rise .2s ease}@keyframes rise{from{transform:translateY(20px);opacity:.7}to{transform:none;opacity:1}}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{font-size:20px;margin:0;letter-spacing:-.04em}.close-btn{border:0;background:var(--surface2);color:var(--muted);width:36px;height:36px;border-radius:12px;font-size:20px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:14px;padding:13px 14px;min-height:48px}.field textarea{min-height:126px;resize:vertical;line-height:1.5}.field-hint{font-size:11px;color:var(--muted);line-height:1.45}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 11px}.modal-actions{display:flex;gap:10px;margin-top:20px}.modal-actions>*{flex:1}.secondary{border:1px solid var(--line);background:var(--surface2);color:var(--text);font-weight:700;border-radius:15px;padding:13px}.toast{position:fixed;z-index:20;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(min-width:600px){.app{padding-left:28px;padding-right:28px}.modal-backdrop{align-items:center}.modal{border-radius:26px}.detail-fab{right:calc((100vw - 664px)/2)}}
    [data-theme="pastel"] .list-card,[data-theme="pastel"] .item{border-color:#d5b9c6;box-shadow:0 8px 24px #6733482b}[data-theme="pastel"] .icon-btn,[data-theme="pastel"] .back-btn{border-color:#d5b9c6;box-shadow:0 5px 15px #67334826}[data-theme="pastel"] .empty{border-color:#d2b3c2;box-shadow:inset 0 2px 12px #67334812}.mode-action{padding:10px 12px;border-radius:14px;font-size:12px;white-space:nowrap}.items.edit-mode{padding-bottom:100px}.items.edit-mode .item{grid-template-columns:minmax(0,1fr) auto}.items.edit-mode .item-edit{grid-column:1/3}.view.editing .summary{display:none}.view.editing .detail-fab{bottom:24px}
    .item-price-entry{display:grid;gap:3px;justify-items:end}.item-price-entry span{font-size:9px;color:var(--muted);white-space:nowrap}.unit-price-input{width:94px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-weight:750;text-align:right;padding:8px 9px;font-size:13px}.unit-price-input::placeholder{color:var(--muted);font-weight:500}
    .qty-inline{display:inline-flex;align-items:center;gap:6px}.qty-inline span{font-size:10px;color:var(--muted)}.qty-inline input{width:58px;min-height:30px;padding:4px 7px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font-size:12px;font-weight:750;text-align:center}.items.edit-mode .item-meta{margin-top:8px}
    .welcome-copy{margin:0 0 15px;color:var(--muted);line-height:1.5;font-size:14px}.theme-options{display:grid;gap:9px}.theme-choice{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--bg)}.theme-choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}.theme-preview{width:44px;height:44px;border-radius:13px;flex:none;border:1px solid #0002}.dark-preview{background:linear-gradient(135deg,#101416 0 55%,#00b6ae 55%)}.pastel-preview{background:linear-gradient(135deg,#fbf6f3 0 55%,#d77b9b 55%)}.theme-choice strong,.theme-choice small{display:block}.theme-choice strong{font-size:14px}.theme-choice small{font-size:11px;color:var(--muted);margin-top:3px}.theme-radio{margin-left:auto;width:19px;height:19px;border:2px solid var(--line);border-radius:50%;flex:none}.theme-choice[aria-pressed="true"] .theme-radio{border:6px solid var(--accent)}.install-option{margin:16px 0 4px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface2)}.install-option .primary{width:100%;padding:13px}.install-option .field-hint{margin-top:9px}.welcome-done{width:100%;margin-top:17px}
  </style>

<body>
  <main class="app">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Abrir menú" aria-expanded="false"> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/><path d="m7 6 2 2 3-3"/></svg></button>
      <div id="brandName" class="brand-name">AnarkShop</div><span class="header-spacer"></span>
    </header>
    <section id="homeView" class="view active">
      <div class="hero"><div id="homeEyebrow" class="eyebrow">Compras más simples</div><h1 id="homeGreeting">Hola</h1><p id="homeIntro">Organiza tus compras y lleva el control mientras recorres la tienda.</p></div>
      <div class="section-head"><h2 id="listsHeading">Tus listas</h2><span id="listCount" class="count"></span></div>
      <div id="listStack" class="list-stack"></div>
      <button class="primary create-cta" id="createListBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="createListLabel">Crear nueva lista</span></button>
    </section>
    <section id="detailView" class="view">
      <div class="detail-head"><button class="back-btn" id="backBtn" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><div class="detail-title-wrap"><div id="detailTitle" class="detail-title"></div><div id="detailSub" class="detail-sub"></div></div><button class="icon-btn" id="shareBtn" aria-label="Compartir" title="Compartir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.7 6.6-4.4m-6.6 7 6.6 4.4"/></svg></button><button id="deleteCurrentBtn" class="icon-btn danger-btn" aria-label="Eliminar lista" title="Eliminar lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg></button><button class="primary mode-action" id="modeBtn">Guardar lista</button></div>
      <div id="items" class="items"></div>
      <button class="primary detail-fab" id="addItemBtn" aria-label="Agregar artículo" title="Agregar artículo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <div class="summary"><div class="summary-inner"><div class="spent"><div id="spentLabel" class="spent-label">Gastado hasta ahora</div><div id="totalSpent" class="spent-total"></div></div><div class="progress-wrap"><div id="progressText" class="progress-text"></div><div class="progress-track"><div id="progressFill" class="progress-fill"></div></div></div><button id="clearBoughtBtn" class="primary" title="Quitar artículos comprados">Limpiar</button></div></div>
    </section>
  </main>
  <div id="drawerRoot">
    <div id="drawerScrim" class="drawer-scrim"></div>
    <aside class="drawer" aria-label="Menú principal">
      <div class="drawer-profile"><div id="drawerAvatar" class="avatar-badge">☀️</div><div><div id="drawerName" class="drawer-name">Usuario</div><div id="drawerCaption" class="drawer-caption">Listas de compras</div></div></div>
      <button id="homeNav" class="drawer-link" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1Z"/></svg>Inicio</button>
      <button id="profileNav" class="drawer-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Perfil</button>
      <div class="drawer-footer">AnarkShop</div>
    </aside>
  </div>
  <div id="modalBackdrop" class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><button class="close-btn" id="closeModal" aria-label="Cerrar">×</button></div><form id="modalForm"></form></section></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="text/plain" id="legacy-app-script">
    (()=>{
      const STORE='anarkshop-data-v1',THEME='anarkshop-theme-v1';
      const $=id=>document.getElementById(id); let lists=load(),currentId=null,activeMode='shop',modalMode=null,editingId=null,toastTimer,deferredInstallPrompt=null;
      const isPhone=/iPhone|iPod|Android.*Mobile/i.test(navigator.userAgent)||(matchMedia('(max-width: 600px) and (pointer: coarse)').matches);
      const icons={bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l1 12H4L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg>',trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg>',edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5 4 4M4 20l4-.8L19 8a2.8 2.8 0 0 0-4-4L4 15l-1 5Z"/></svg>'};
      function load(){try{const d=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(d)?d.map(l=>({...l,saved:l.saved!==false,items:Array.isArray(l.items)?l.items:[]})):[]}catch{return[]}}
      function save(){try{localStorage.setItem(STORE,JSON.stringify(lists))}catch{notify('No se pudo guardar. Revisa el espacio disponible.')}}
      function uid(){return globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2)}
      function fmtMoney(n){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(n||0)}
      function fmtDate(iso){try{return new Intl.DateTimeFormat('es-AR',{day:'numeric',month:'short'}).format(new Date(iso))}catch{return''}}
      function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
      function notify(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2300)}
      function applyTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem(THEME,theme);document.querySelector('meta[name="theme-color"]').content=theme==='pastel'?'#fbf6f3':'#101416';$('themeToggle').setAttribute('aria-label',theme==='pastel'?'Cambiar al tema oscuro':'Cambiar al tema pastel');document.querySelectorAll('[data-theme-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeChoice===theme)))}
      function listById(id){return lists.find(l=>l.id===id)}
      function renderHome(){ $('listCount').textContent=lists.length?`${lists.length} ${lists.length===1?'lista':'listas'}`:''; const host=$('listStack'); if(!lists.length){host.innerHTML='<div class="empty"><div class="empty-icon">'+icons.bag+'</div><strong>Tu próxima compra empieza aquí</strong>Crea una lista y agrega todo lo que necesitas.</div>';return} host.innerHTML=lists.slice().sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)).map(l=>{const done=l.items.filter(i=>i.done).length;return `<article class="list-card"><div class="list-symbol">${icons.bag}</div><button class="list-open" data-open="${safe(l.id)}"><span class="list-title">${safe(l.name)}</span><span class="list-meta">${l.saved?`${l.items.length} ${l.items.length===1?'artículo':'artículos'} · ${done} comprados`:`Borrador · ${l.items.length} ${l.items.length===1?'artículo':'artículos'} · falta guardar`} · ${fmtDate(l.updatedAt)}</span></button><div class="card-actions"><button class="small-btn" data-rename="${safe(l.id)}" aria-label="Cambiar nombre" title="Cambiar nombre">${icons.edit}</button><button class="small-btn" data-delete="${safe(l.id)}" aria-label="Eliminar lista" title="Eliminar lista">${icons.trash}</button></div></article>`}).join(''); host.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openList(b.dataset.open));host.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteList(b.dataset.delete));host.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>renameList(b.dataset.rename)) }
      function openList(id){currentId=id;activeMode=listById(id)?.saved===false?'edit':'shop';$('homeView').classList.remove('active');$('detailView').classList.add('active');renderDetail();window.scrollTo(0,0)}
      function goHome(){currentId=null;$('detailView').classList.remove('active');$('homeView').classList.add('active');renderHome();window.scrollTo(0,0)}
      function renderDetail(){
        const l=listById(currentId);if(!l){goHome();return}
        const editing=activeMode==='edit';$('detailView').classList.toggle('editing',editing);$('items').classList.toggle('edit-mode',editing);$('modeBtn').textContent=editing?'Guardar lista':'Editar lista';$('detailTitle').textContent=l.name;
        $('detailSub').textContent=`${editing?'Preparando lista':'Lista para comprar'} · ${l.items.length} ${l.items.length===1?'artículo':'artículos'}`;
        const host=$('items');
        if(!l.items.length){host.innerHTML='<div class="empty"><div class="empty-icon">'+icons.bag+'</div><strong>Lista vacía</strong><p style="margin:7px 0 16px;line-height:1.45">Pega aquí una lista que tengas en WhatsApp o en un documento de texto, o agrega artículos uno por uno.</p><button class="primary" id="pasteListBtn" style="margin:auto">Pegar una lista</button></div>';$('pasteListBtn').onclick=showPasteModal}
        else{
          host.innerHTML=l.items.map((i,n)=>`<article class="item ${!editing&&i.done?'done':''}">${editing?'':`<input class="check" type="checkbox" ${i.done?'checked':''} data-check="${safe(i.id)}" aria-label="Marcar ${safe(i.name)} como comprado">`}<div class="item-main"><div class="item-name">${n+1}. ${safe(i.name)}</div><div class="item-meta">${editing?`<label class="qty-inline"><span>CANT.</span><input type="text" inputmode="decimal" value="${safe(i.quantity||'1')}" data-qty="${safe(i.id)}" aria-label="Cantidad de ${safe(i.name)}"></label>`:`<span>Cant. ${safe(i.quantity||'1')}</span>`}${i.brand?`<span>${safe(i.brand)}</span>`:''}</div></div>${!editing&&i.done?`<label class="item-price-entry"><span>PRECIO POR UNIDAD</span><input class="unit-price-input" inputmode="decimal" placeholder="$ 0,00" value="${i.price==null?'':safe(i.price)}" data-price="${safe(i.id)}" aria-label="Precio por unidad de ${safe(i.name)}"></label>`:`<div class="item-price ${i.price==null?'empty-price':''}">${i.price==null?'—':fmtMoney(Number(i.price)*numberQty(i.quantity))}</div>`}<div class="item-edit"><button data-edit="${safe(i.id)}">Editar artículo</button><button data-remove="${safe(i.id)}">Eliminar</button></div></article>`).join('');
          host.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{const item=l.items.find(i=>i.id===c.dataset.check);if(item){item.done=c.checked;touch(l);save();renderDetail();if(c.checked&&item.price==null)setTimeout(()=>$('items').querySelector(`[data-price="${item.id}"]`)?.focus(),0)}});
          host.querySelectorAll('[data-qty]').forEach(input=>input.oninput=()=>{const item=l.items.find(i=>i.id===input.dataset.qty);if(!item)return;const raw=input.value.trim().replace(',','.');if(raw===''||/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(raw)){item.quantity=raw===''?'1':raw;touch(l);save()}});
          host.querySelectorAll('[data-qty]').forEach(input=>input.onchange=()=>{const item=l.items.find(i=>i.id===input.dataset.qty);if(!item)return;const raw=input.value.trim().replace(',','.');if(!Number.isFinite(Number(raw))||Number(raw)<=0){item.quantity='1';save();renderDetail()}});
          host.querySelectorAll('[data-price]').forEach(input=>input.oninput=()=>{const item=l.items.find(i=>i.id===input.dataset.price);if(!item)return;const raw=input.value.trim().replace(',','.');if(raw===''||/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(raw)){item.price=raw===''?null:Number(raw);touch(l);save();updateSummary(l)}});
          host.querySelectorAll('[data-price]').forEach(input=>input.onchange=()=>{const raw=input.value.trim().replace(',','.');if(raw!==''&&!Number.isFinite(Number(raw))){input.value='';const item=l.items.find(i=>i.id===input.dataset.price);if(item)item.price=null;save();updateSummary(l)}});
          host.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>showItemModal(b.dataset.edit));host.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeItem(b.dataset.remove));
        }
        updateSummary(l);$('detailSub').textContent=`${editing?'Preparando lista':'Lista para comprar'} · ${l.items.length} ${l.items.length===1?'artículo':'artículos'}`
      }
      function updateSummary(l){const bought=l.items.filter(i=>i.done),total=bought.reduce((s,i)=>s+(i.price==null?0:(Number(i.price)||0)*numberQty(i.quantity)),0);$('totalSpent').textContent=fmtMoney(total);$('progressText').textContent=`${bought.length}/${l.items.length} comprados`;$('progressFill').style.width=(l.items.length?bought.length/l.items.length*100:0)+'%'}
      function numberQty(q){const n=Number(String(q??'1').replace(',','.'));return Number.isFinite(n)&&n>0?n:1}
      function touch(l){l.updatedAt=new Date().toISOString()}
      function deleteList(id){const l=listById(id);if(!l||!confirm(`¿Eliminar la lista «${l.name}» y sus artículos?`))return;lists=lists.filter(x=>x.id!==id);save();renderHome();notify('Lista eliminada')}
      function renameList(id){const l=listById(id);if(!l)return;showModal('Cambiar nombre',`<div class="field"><label for="listName">Nombre de la lista</label><input id="listName" maxlength="70" required value="${safe(l.name)}"></div><div class="modal-actions"><button type="button" class="secondary" data-cancel>Cancelar</button><button class="primary" type="submit">Guardar</button></div>`,'rename',id);$('listName').focus()}
      function showModal(title,html,mode,entityId=null){modalMode=mode;editingId=entityId;$('modalTitle').textContent=title;$('modalForm').innerHTML=html;$('modalBackdrop').classList.add('open');$('modalForm').onsubmit=submitModal;$('modalForm').querySelector('[data-cancel]')?.addEventListener('click',closeModal);$('modalBackdrop').onclick=e=>{if(e.target===$('modalBackdrop'))closeModal()};setTimeout(()=>$('modalForm').querySelector('input,textarea')?.focus(),40)}
      function closeModal(){$('modalBackdrop').classList.remove('open');modalMode=null;editingId=null}
      function showCreateModal(){showModal('Crear nueva lista',`<div class="field"><label for="listName">Nombre de la lista</label><input id="listName" maxlength="70" placeholder="Ej. Compras de la semana" required></div><div class="field"><label for="importText">Empezar con artículos (opcional)</label><textarea id="importText" placeholder="Leche&#10;Pan&#10;Tomates"></textarea><div class="field-hint">Pega una lista: cada renglón se convierte en un artículo. También puedes usar «2 x Leche» o «Leche - 2» para indicar cantidad.</div></div><div class="modal-actions"><button type="button" class="secondary" data-cancel>Cancelar</button><button class="primary" type="submit">Crear lista</button></div>`,'create')}
      function showPasteModal(){showModal('Pegar lista de compras',`<div class="field"><label for="pasteText">Copia el texto desde WhatsApp o tu documento y pégalo aquí</label><textarea id="pasteText" placeholder="Leche&#10;Pan&#10;2 x Yogur" required></textarea><div class="field-hint">Se agregará cada renglón como un artículo. Puedes indicar cantidades como «2 x Leche» o «Leche - 2».</div></div><div class="modal-actions"><button type="button" class="secondary" data-cancel>Cancelar</button><button class="primary" type="submit">Agregar a la lista</button></div>`,'paste')}
      function showItemModal(id=null){const l=listById(currentId);if(!l)return;const item=id?l.items.find(i=>i.id===id):null;showModal(item?'Editar artículo':'Agregar artículo',`<div class="field"><label for="itemName">Artículo</label><input id="itemName" maxlength="100" placeholder="Ej. Leche entera" required value="${safe(item?.name||'')}"></div><div class="form-grid"><div class="field"><label for="itemQty">Cantidad</label><input id="itemQty" inputmode="decimal" maxlength="12" placeholder="1" value="${safe(item?.quantity||'1')}"></div><div class="field"><label for="itemBrand">Marca (opcional)</label><input id="itemBrand" maxlength="60" placeholder="Ej. La Serenísima" value="${safe(item?.brand||'')}"></div></div><div class="field"><label for="itemPrice">Precio unitario en ARS (opcional)</label><input id="itemPrice" inputmode="decimal" placeholder="0,00" value="${item?.price==null?'':safe(item.price)}"></div><div class="modal-actions"><button type="button" class="secondary" data-cancel>Cancelar</button><button class="primary" type="submit">${item?'Guardar cambios':'Agregar artículo'}</button></div>`,'item',id)}
      function showWelcome(){
        const installed=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
        const mobileInstall=isPhone&&!installed;
        const installHtml=mobileInstall?`<div class="install-option"><button class="primary" id="installAppBtn" type="button">Instalar AnarkShop</button><div class="field-hint" id="installHelp">${/iPhone|iPod/i.test(navigator.userAgent)?'Añádela a tu pantalla de inicio para abrirla como una app.':'Instala la app en tu celular para tenerla a mano y usarla sin conexión.'}</div></div>`:'';
        showModal('Bienvenido a AnarkShop',`<p class="welcome-copy">Elige cómo quieres ver tus listas. Puedes cambiar el tema más adelante.</p><div class="theme-options"><button class="theme-choice" type="button" data-theme-choice="dark"><span class="theme-preview dark-preview"></span><span><strong>Oscuro</strong><small>Carbón y turquesa</small></span><span class="theme-radio"></span></button><button class="theme-choice" type="button" data-theme-choice="pastel"><span class="theme-preview pastel-preview"></span><span><strong>Claro</strong><small>Pasteles suaves</small></span><span class="theme-radio"></span></button></div>${installHtml}<button class="primary welcome-done" id="welcomeDone" type="button">Empezar</button>`,'welcome');
        $('closeModal').style.display='none';$('modalBackdrop').onclick=()=>{};
        $('modalForm').querySelectorAll('[data-theme-choice]').forEach(b=>b.onclick=()=>applyTheme(b.dataset.themeChoice));
        $('welcomeDone').onclick=()=>{try{localStorage.setItem('anarkshop-welcome-seen','1')}catch{}closeModal();$('closeModal').style.display=''};
        const installBtn=$('installAppBtn');if(installBtn)installBtn.onclick=async()=>{if(deferredInstallPrompt){deferredInstallPrompt.prompt();const choice=await deferredInstallPrompt.userChoice;if(choice?.outcome==='accepted')installBtn.textContent='Instalación iniciada';deferredInstallPrompt=null;return}const help=$('installHelp');help.textContent=/iPhone|iPod/i.test(navigator.userAgent)?'En Safari: toca Compartir y elige “Agregar a pantalla de inicio”.':'Abre el menú del navegador (⋮) y elige “Instalar app” o “Agregar a pantalla principal”.'};
        applyTheme(document.documentElement.dataset.theme||'dark');
      }
      function parseLines(text){return text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(line=>{line=line.replace(/^(?:[-*•☐☑✅▫️✔️]+\s*|\d+[.)]\s*)/u,'').trim();let name=line,quantity='1';let m=line.match(/^(\d+(?:[.,]\d+)?)\s*[x×*]\s*(.+)$/i);if(m){quantity=m[1].replace(',','.');name=m[2].trim()}else{m=line.match(/^(.+?)\s*[x×]\s*(\d+(?:[.,]\d+)?)\s*$/i);if(m){name=m[1].trim();quantity=m[2].replace(',','.')}else{m=line.match(/^(.+?)\s*(?:-|—|:)\s*(\d+(?:[.,]\d+)?)\s*$/);if(m){name=m[1].trim();quantity=m[2].replace(',','.')}}}return{name,quantity,brand:'',price:null,done:false,id:uid()}}).filter(i=>i.name)}
      function submitModal(e){e.preventDefault();if(modalMode==='create'){const name=$('listName').value.trim();if(!name)return;const l={id:uid(),name,saved:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),items:parseLines($('importText').value)};lists.unshift(l);save();closeModal();renderHome();openList(l.id);notify('Lista creada: agrega artículos y luego guárdala')}else if(modalMode==='paste'){const l=listById(currentId),added=parseLines($('pasteText').value);if(!l||!added.length){notify('Pega al menos un artículo, uno por renglón');return}l.items.push(...added);touch(l);save();closeModal();renderDetail();notify(`${added.length} ${added.length===1?'artículo agregado':'artículos agregados'}`)}else if(modalMode==='rename'){const l=listById(editingId),name=$('listName').value.trim();if(!l||!name)return;l.name=name;touch(l);save();closeModal();renderHome();notify('Nombre actualizado')}else if(modalMode==='item'){const l=listById(currentId),name=$('itemName').value.trim();if(!l||!name)return;const raw=$('itemPrice').value.trim().replace(',','.');const price=raw===''?null:Number(raw);if(price!==null&&(!Number.isFinite(price)||price<0)){notify('Ingresa un precio válido');return}let qty=$('itemQty').value.trim().replace(',','.');if(!qty)qty='1';if(!Number.isFinite(Number(qty))||Number(qty)<=0){notify('La cantidad debe ser mayor que cero');return}const data={name,quantity:qty,brand:$('itemBrand').value.trim(),price};if(editingId){const item=l.items.find(i=>i.id===editingId);if(item)Object.assign(item,data)}else l.items.push({...data,done:false,id:uid()});touch(l);save();closeModal();renderDetail();notify(editingId?'Artículo actualizado':'Artículo agregado')}}
      function removeItem(id){const l=listById(currentId);if(!l)return;l.items=l.items.filter(i=>i.id!==id);touch(l);save();renderDetail();notify('Artículo eliminado')}
      function shareList(){const l=listById(currentId);if(!l)return;const lines=[`🛒 ${l.name}`,...l.items.map(i=>`${i.done?'✅':'▫️'} ${i.name} · ${i.quantity}${i.brand?' · '+i.brand:''}${i.price!=null?' · '+fmtMoney(Number(i.price)*numberQty(i.quantity)):''}`)];if(!l.items.length)lines.push('Lista vacía');const url='https://wa.me/?text='+encodeURIComponent(lines.join('\n'));window.open(url,'_blank','noopener,noreferrer')}
      $('createListBtn').onclick=showCreateModal;$('addItemBtn').onclick=()=>showItemModal();$('backBtn').onclick=goHome;$('shareBtn').onclick=shareList;$('modeBtn').onclick=()=>{const l=listById(currentId);if(!l)return;if(activeMode==='edit'){l.saved=true;activeMode='shop';touch(l);save();notify('Lista guardada. ¡A comprar!')}else{activeMode='edit';l.saved=false;touch(l);save()}renderDetail()};$('closeModal').onclick=closeModal;$('themeToggle').onclick=()=>applyTheme(document.documentElement.dataset.theme==='pastel'?'dark':'pastel');$('clearBoughtBtn').onclick=()=>{const l=listById(currentId);if(!l)return;const n=l.items.filter(i=>i.done).length;if(!n){notify('Todavía no hay artículos comprados');return}if(!confirm(`¿Quitar ${n} ${n===1?'artículo comprado':'artículos comprados'} de la lista?`))return;l.items=l.items.filter(i=>!i.done);touch(l);save();renderDetail();notify('Artículos comprados eliminados')};
      try{applyTheme(localStorage.getItem(THEME)==='pastel'?'pastel':'dark')}catch{document.documentElement.dataset.theme='dark'}renderHome();
      window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event});
      window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;const b=$('installAppBtn');if(b)b.textContent='AnarkShop instalada'});
      try{if(!localStorage.getItem('anarkshop-welcome-seen'))showWelcome()}catch{showWelcome()}
      if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    })();
  </script>
  <script src="./app.js"></script>
</body>
